services:
  - type: web
    name: kit-campusai-backend
    env: python
    region: oregon
    plan: free
    branch: claude/build-camp-ai-bot-phase1-01CSwb6bLtAfHkKW5EYTX7sS
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        fromDatabase:
          name: kit-campusai-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: False
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: kit-campusai-db
    databaseName: kit_campusai
    user: kit_campusai_user
    plan: free
    region: oregon
    postgresMajorVersion: 15
    # After database is created, enable pgvector extension:
    # Go to database Shell tab and run: CREATE EXTENSION IF NOT EXISTS vector;
