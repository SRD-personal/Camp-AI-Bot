services:
  - type: web
    name: kit-campusai-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: kit-campusai-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: False
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /health

databases:
  - name: kit-campusai-db
    databaseName: kit_campusai
    user: kit_campusai_user
    plan: free
    region: oregon
    postgresMajorVersion: 15
